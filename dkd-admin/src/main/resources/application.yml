# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.7
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为 8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.dkd: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: 123456
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.dkd.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# ==========================================================
# XXL-Job 执行器配置
# ----------------------------------------------------------
# 整个项目扮演两个角色：
#   ① Web 服务（8080）—— 给人用的后台
#   ② XXL-Job 执行器（9999）—— 给调度中心调用的"工人"
# 这两个端口是两个独立的东西，别搞混。
# ==========================================================
xxl:
  job:
    admin:
      # ★ 调度中心地址（就是你部署的 xxl-job-admin）
      #   多个地址用逗号分隔；部署在哪台机器就填哪台的 IP
      addresses: http://127.0.0.1:8081/xxl-job-admin
    # ★ 访问令牌，必须和调度中心 xxl-job-admin 的 xxl.job.accessToken 一致
    #   默认值 default_token；不一致会报 "The access token is wrong"
    accessToken: default_token
    executor:
      # ★ 执行器名称，必须和调度中心页面上「执行器管理」里新增的 AppName 一致
      appname: dkd-manage-executor
      # 执行器注册地址（留空 '' 表示自动获取；一般不用填）
      address: ''
      # 执行器注册 IP（留空 '' 表示自动获取；多网卡时可能要手动指定）
      ip: ''
      # ★ 执行器端口（Netty 端口，不是 Tomcat 的 8080）
      #   多实例部署时，每个实例的 port 必须不同（8081 被调度中心占了，所以用 9999）
      port: 9999
      # 执行日志存放路径（调度中心页面上能点开看的详细日志）
      logpath: ./logs/xxl-job/jobhandler
      # 执行日志保留天数
      logretentiondays: 30
